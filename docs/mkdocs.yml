site_name: OOps
site_url: https://oops.valtech.ai/
docs_dir: docs
site_dir: site

hooks:
  - gen_pages.py

nav:
  - Home: index.md
  - Operators: []
  - Examples: examples/index.md
  - About:
      - License: about/license.md
      - License FAQ: about/license-faq.md
      - Privacy Notice: about/privacy.md

theme:
  name: material
  language: en

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [..]
          options:
            allow_inspection: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_options:
              returns_multiple_items: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          build: true
          default: true
          name: English
        - locale: zh
          build: true
          name: 中文
          nav_translations:
            Home: 首页
            Operators: 算子
            Examples: 示例
            API: API
            About: 关于
            Privacy Notice: 隐私声明
            License: 许可证
            License FAQ: 许可协议常见问题

extra:
  analytics:
    provider: google
    property: "G-0FVNQTYNZ2"
  consent:
    title: Cookie Consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better. Please check out our
      <a href="https://oops.valtech.ai/about/privacy">Privacy Notice</a> for more information.

markdown_extensions:
  - admonition
  - attr_list
  - markdown_gfm_admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

watch:
  - ../examples/
  - ../README.md
  - ../README.zh.md
  - ../license.md
  - ../license.zh.md
  - ../license-faq.md
  - ../license-faq.zh.md
  - ../oops
  - ../privacy.md
  - ../privacy.zh.md
