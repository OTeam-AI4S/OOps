name: push

on: [push, pull_request]

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - uses: pre-commit/action@v3.0.1

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install documentation environment
        run: |
          python -m pip install -U pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[docs]"
      - name: Build documentation
        run: python -m mkdocs build --strict -f docs/mkdocs.yml
        env:
          DISABLE_MKDOCS_2_WARNING: "true"
          NO_MKDOCS_2_WARNING: "true"
      - name: Upload Pages artifact
        if: >-
          github.event_name == 'push' &&
          github.repository == 'OTeam-AI4S/OOps' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  build:
    runs-on: ubuntu-latest
    needs: [lint, docs]
    outputs:
      prerelease: ${{ steps.release_metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "oops/py.typed" in names
              assert "oops/_version.py" in names
              assert not any(name.startswith("tests/") for name in names)

          with open_tar(sdist) as archive:
              names = {name.split("/", 1)[-1] for name in archive.getnames()}
              assert "oops/py.typed" in names
              assert "oops/_version.py" in names
          PY
      - name: Validate release metadata
        id: release_metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from email.parser import Parser
          from pathlib import Path, PurePosixPath
          from tarfile import open as open_tar
          from zipfile import ZipFile

          from packaging.version import Version

          expected = Version(os.environ["RELEASE_TAG"].removeprefix("v"))
          if expected.is_devrelease or expected.local is not None:
              raise SystemExit("release tags must not select development or local versions")

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))
          with ZipFile(wheel) as archive:
              metadata_paths = [name for name in archive.namelist() if name.endswith(".dist-info/METADATA")]
              if len(metadata_paths) != 1:
                  raise SystemExit("wheel must contain exactly one METADATA file")
              wheel_metadata = archive.read(metadata_paths[0]).decode("utf-8")
          with open_tar(sdist) as archive:
              metadata_paths = [
                  member for member in archive.getmembers()
                  if member.isfile() and len(PurePosixPath(member.name).parts) == 2
                  and PurePosixPath(member.name).name == "PKG-INFO"
              ]
              if len(metadata_paths) != 1:
                  raise SystemExit("sdist must contain exactly one root PKG-INFO file")
              with archive.extractfile(metadata_paths[0]) as stream:
                  sdist_metadata = stream.read().decode("utf-8")
          for kind, text in (("wheel", wheel_metadata), ("sdist", sdist_metadata)):
              metadata = Parser().parsestr(text)
              if metadata["Name"] != "ooperators":
                  raise SystemExit(f"{kind} distribution name must be ooperators")
              actual = Version(metadata["Version"])
              if actual != expected or actual.is_devrelease or actual.local is not None:
                  raise SystemExit(f"{kind} version {actual} does not match release tag {expected}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"prerelease={str(expected.is_prerelease).lower()}\n")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  release:
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      github.repository == 'OTeam-AI4S/OOps'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            prerelease_args=()
            if [ "$PRERELEASE" = "true" ]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes "${prerelease_args[@]}"
          fi

  pages:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'OTeam-AI4S/OOps' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: [build, docs]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
