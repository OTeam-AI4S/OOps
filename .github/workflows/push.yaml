name: push

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -U pip pytest pytest-cov
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m pytest -m "not lfs" --cov=oops --cov-report=xml .

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tools
        run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Check distributions
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          from tarfile import open as open_tar
          from zipfile import ZipFile

          wheel = next(Path("dist").glob("*.whl"))
          sdist = next(Path("dist").glob("*.tar.gz"))

          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
              assert "oops/py.typed" in names
              assert "oops/_version.py" in names
              assert not any(name.startswith("tests/") for name in names)

          with open_tar(sdist) as archive:
              names = {name.split("/", 1)[-1] for name in archive.getnames()}
              assert "oops/py.typed" in names
              assert "oops/_version.py" in names
          PY
