site_name: OOps
docs_dir: docs
site_dir: build/docs

exclude_docs: |
  /generate_docs.py
  /__pycache__/

hooks:
  - docs/generate_docs.py

nav:
  - Home: index.md
  - API: api.md
  - License: license.md

theme:
  name: material
  language: en

plugins:
  - search
  - autorefs:
      resolve_closest: true
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            allow_inspection: false
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            docstring_options:
              returns_multiple_items: false
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          build: true
          default: true
          name: English
        - locale: zh
          build: true
          name: 中文
          nav_translations:
            Home: 首页
            API: API
            License: 许可证

markdown_extensions:
  - markdown_gfm_admonition
  - pymdownx.superfences
  - toc:
      permalink: true

watch:
  - README.md
  - README.zh.md
  - LICENSE
  - oops
