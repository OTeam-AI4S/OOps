site_name: OOps
site_url: https://oops.valhalla.technology/
docs_dir: docs

exclude_docs: |
  /generate_docs.py
  /__pycache__/

hooks:
  - docs/generate_docs.py

nav:
  - Home: index.md
  - About:
      - License: about/license.md
      - License FAQ: about/license-faq.md
      - Privacy Notice: about/privacy.md

theme:
  name: material
  language: en

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          build: true
          default: true
          name: English
        - locale: zh
          build: true
          name: 中文
          nav_translations:
            Home: 首页
            About: 关于
            Privacy Notice: 隐私声明
            License: 许可证
            License FAQ: 许可协议常见问题

extra:
  analytics:
    provider: google
    property: "G-0FVNQTYNZ2"
  consent:
    title: Cookie Consent
    description: >-
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better. Please check out our
      <a href="https://oops.valhalla.technology/about/privacy/">Privacy Notice</a> for more information.

markdown_extensions:
  - admonition
  - attr_list
  - markdown_gfm_admonition
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - toc:
      permalink: true

watch:
  - README.md
  - README.zh.md
  - license.md
  - license.zh.md
  - license-faq.md
  - license-faq.zh.md
  - privacy.md
  - privacy.zh.md
